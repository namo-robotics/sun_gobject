name: Build and test
on:
  push:
  pull_request:
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build development image with Sun dev Debian package
        run: docker build -t sun-gobject-dev .
      - name: Build and test
        # D-Bus requires a passwd entry for the runner UID inside the container.
        run: >-
          docker run --rm --user "$(id -u):$(id -g)"
          -v /etc/passwd:/etc/passwd:ro
          -v /etc/group:/etc/group:ro
          -e XDG_DATA_HOME=/workspaces/sun_gobject/tmp/ci/data
          -e XDG_CACHE_HOME=/workspaces/sun_gobject/tmp/ci/cache
          -e XDG_CONFIG_HOME=/workspaces/sun_gobject/tmp/ci/config
          -v "$PWD:/workspaces/sun_gobject" sun-gobject-dev
          bash -c 'mkdir -p "$XDG_DATA_HOME" "$XDG_CACHE_HOME" "$XDG_CONFIG_HOME" && ./build.sh && sun fmt --check src tools examples tests/main.sun tests/runtime.sun tests/support.sun tests/generator.sun tests/integration.sun tests/events.sun tests/event-client.sun'
      - name: Upload generation evidence and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-generation-and-tests
          path: |
            build/native/native-versions.txt
            build/sun-version.txt
            build/generated/provenance.json
            build/generated/coverage.tsv
            build/test-results.log
