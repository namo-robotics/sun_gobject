name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build development image with Sun dev Debian package
        run: docker build -t sun-gobject-dev .
      - name: Build and test
        # D-Bus requires a passwd entry for the runner UID inside the container.
        run: >-
          docker run --rm --user "$(id -u):$(id -g)"
          -v /etc/passwd:/etc/passwd:ro
          -v /etc/group:/etc/group:ro
          -e XDG_DATA_HOME=/workspaces/sun_gobject/tmp/ci/data
          -e XDG_CACHE_HOME=/workspaces/sun_gobject/tmp/ci/cache
          -e XDG_CONFIG_HOME=/workspaces/sun_gobject/tmp/ci/config
          -v "$PWD:/workspaces/sun_gobject" sun-gobject-dev
          bash -c 'mkdir -p "$XDG_DATA_HOME" "$XDG_CACHE_HOME" "$XDG_CONFIG_HOME" && ./build.sh && sun fmt --check src tools examples tests'
      - name: Upload generation evidence and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-generation-and-tests
          path: |
            build/native/native-versions.txt
            build/sun-version.txt
            build/generated/provenance.json
            build/generated/coverage.tsv
            build/test-results.log
      - name: Package tested Linux development bundles
        run: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/workspaces/sun_gobject" sun-gobject-dev sun tools/package.sun
      - uses: actions/upload-artifact@v4
        with:
          name: sun-gobject-linux-release
          if-no-files-found: error
          path: build/sun-gobject_0.dev_amd64.deb
  publish:
    needs: linux
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sun-gobject-linux-release
          path: build/release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          target_commitish: ${{ github.sha }}
          name: Development Build
          prerelease: true
          fail_on_unmatched_files: true
          files: build/release/*.deb
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain and GTK dependencies
        run: brew install namo-robotics/sun/sun gtk4 librsvg gstreamer coreutils cmake ninja pkgconf gobject-introspection
      - name: Build and test native bundles
        run: ./scripts/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sun_gobject-macos-arm64
          if-no-files-found: error
          path: build/sun_gobject-arm64-apple-darwin.tar.gz
  publish-macos:
    needs: macos
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sun_gobject-macos-arm64
          path: build/release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          target_commitish: ${{ github.sha }}
          name: Development Build
          prerelease: true
          fail_on_unmatched_files: true
          files: build/release/sun_gobject-arm64-apple-darwin.tar.gz
