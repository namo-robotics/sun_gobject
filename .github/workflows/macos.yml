name: macOS bundles
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain and GTK dependencies
        run: brew install namo-robotics/sun/sun gtk4 librsvg gstreamer coreutils cmake ninja pkgconf gobject-introspection
      - name: Build and test native bundles
        run: ./scripts/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sun_gobject-macos-arm64
          if-no-files-found: error
          path: build/sun_gobject-arm64-apple-darwin.tar.gz
  publish:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sun_gobject-macos-arm64
          path: build/release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          target_commitish: ${{ github.sha }}
          name: Development Build
          prerelease: true
          fail_on_unmatched_files: true
          files: build/release/sun_gobject-arm64-apple-darwin.tar.gz
